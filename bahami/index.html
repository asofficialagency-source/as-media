*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Jost,system-ui,sans-serif;font-weight:400;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding:34px 22px 80px}
header{text-align:center;margin-bottom:26px}

.sub{font-size:10.5px;letter-spacing:4px;text-transform:uppercase;color:var(--acc);margin-top:4px}
.lang{display:flex;justify-content:center;gap:16px;margin-top:16px}
.lang button{background:none;border:0;font:inherit;font-size:11px;letter-spacing:2px;color:var(--soft);cursor:pointer;padding:4px 2px;border-bottom:1px solid transparent}
.lang button.on{color:var(--ink);border-color:var(--acc)}
.prog{display:flex;align-items:center;gap:10px;margin:8px 0 6px}
.prog .ln{flex:1;height:1px;background:var(--line);position:relative}
.prog .ln i{position:absolute;left:0;top:-1px;height:3px;background:var(--acc);border-radius:3px;transition:width .6s ease}
.prog .ln b{position:absolute;top:-6px;width:13px;height:13px;border-radius:50%;background:#F3E6E0;border:1px solid var(--acc);transition:left .6s ease;margin-left:-6px}
.meta{display:flex;justify-content:space-between;font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:var(--soft);margin-bottom:22px}
.meta em{font-family:'Cormorant Garamond',serif;font-style:italic;letter-spacing:0;text-transform:none;font-size:16px;color:var(--acc)}
.step{display:none;animation:in .5s ease}
.step.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.pic{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;margin-bottom:26px;border-radius:2px}
h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:400;font-size:34px;line-height:1.15;text-align:center;margin:0 0 12px}
.intro{text-align:center;color:var(--soft);font-weight:300;margin:0 auto 6px;max-width:440px}
hr{border:0;border-top:1px solid var(--line);margin:30px 0}
.q{margin:0 0 30px}
.q h2{font-family:Jost,sans-serif;font-weight:400;font-size:18px;margin:0 0 4px;line-height:1.4}
.q p.h{color:var(--soft);font-weight:300;font-size:14.5px;margin:0 0 12px}
.q h2+.chips,.q h2+textarea,.q h2+input,.q h2+.two,.q h2+.ph{margin-top:12px}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip span{display:inline-block;border:1px solid var(--line);background:#fff;padding:11px 16px;font-size:15px;font-weight:300;cursor:pointer;transition:all .2s;border-radius:2px}
.chip input:checked+span{border-color:var(--acc);background:var(--acc-l);color:var(--acc-d)}
.chip input:focus-visible+span{outline:2px solid var(--acc);outline-offset:2px}
textarea,input[type=text],input[type=email]{width:100%;font:inherit;font-weight:300;font-size:16px;background:#fff;border:1px solid var(--line);padding:13px 14px;color:var(--ink);border-radius:2px}
textarea{min-height:92px;resize:vertical}
textarea:focus,input:focus{outline:none;border-color:var(--acc)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.why{margin-top:12px;display:none}
.why.on{display:block;animation:in .3s ease}
.why label{display:block;color:var(--acc-d);font-style:italic;font-family:'Cormorant Garamond',serif;font-size:17px;margin-bottom:6px}
.why textarea{min-height:64px}
.ph{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ph label{position:relative;aspect-ratio:4/5;border:1px dashed #D9C9BF;background:#fff;display:grid;place-items:center;cursor:pointer;overflow:hidden;font-size:13px;color:var(--soft);text-align:center;padding:10px}
.ph input{position:absolute;opacity:0;width:1px;height:1px}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
.ph label.has img{display:block}
.ph small{position:absolute;top:8px;left:8px;background:#fff;color:var(--acc-d);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;padding:3px 8px;z-index:2}
.nav{display:flex;gap:10px;margin-top:10px}
.btn{flex:1;border:0;background:var(--ink);color:#fff;font:inherit;font-size:13px;letter-spacing:3px;text-transform:uppercase;padding:17px;cursor:pointer;border-radius:2px}
.btn.ghost{flex:0 0 auto;background:none;color:var(--ink);border:1px solid var(--line);padding:17px 20px}
.btn:disabled{opacity:.6}
.err{color:#A3392F;font-size:14px;min-height:20px;margin-top:10px;text-align:center}
.gal{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -22px;padding:0 22px 4px;scrollbar-width:none}
.gal::-webkit-scrollbar{display:none}
.gal a{flex:0 0 44%;max-width:210px;aspect-ratio:4/5;overflow:hidden;scroll-snap-align:start;position:relative;display:block;background:var(--acc-l)}

.cap{display:flex;justify-content:space-between;font-size:12px;color:var(--soft);margin-top:10px}
.cap a{color:var(--acc-d);text-decoration:none}
.sig{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:24px;color:var(--acc-d);text-align:center;margin:8px 0 0}
.pick{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);padding:16px 18px;margin-bottom:10px;font:inherit;color:var(--ink);cursor:pointer;border-radius:2px}
.pick b{font-weight:500}
.pick span{display:block;font-size:13.5px;color:var(--soft);font-weight:300}
.pick.top{border-color:var(--acc)}
.pick .best{float:right;font-style:normal;font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--acc-d)}
.pick.on{background:var(--acc-l);border-color:var(--acc)}
.how{display:none;background:#fff;border:1px solid var(--line);border-top:0;margin:-10px 0 10px;padding:14px 18px 16px;font-size:15px;font-weight:300}
.how.on{display:block;animation:in .3s ease}
.how ol{margin:6px 0 10px;padding-left:20px}
.how li{margin-bottom:4px}
.copy{border:1px solid var(--acc);background:var(--acc-l);color:var(--acc-d);font:inherit;font-size:12px;letter-spacing:2px;text-transform:uppercase;padding:11px 14px;cursor:pointer;border-radius:2px}
pre.rv{white-space:pre-wrap;font:inherit;font-size:14px;background:var(--bg);border:1px solid var(--line);padding:12px;margin:8px 0 10px;max-height:220px;overflow:auto}
.cta{display:block;text-align:center;margin-top:12px;background:var(--ink);color:#fff;text-decoration:none;font-size:12px;letter-spacing:3px;text-transform:uppercase;padding:16px;border-radius:2px}
.cta.o{background:none;color:var(--ink);border:1px solid var(--line)}
.hp{position:absolute;left:-9999px;opacity:0}
@media (max-width:380px){h1{font-size:30px}.chip span{padding:10px 13px;font-size:14.5px}}
</style>

   {k:'Wilde vooraf weten',t:'multi',q:L3('What did you want to see or know before you booked?','Qu’auriez-vous voulu voir ou savoir avant de réserver ?','Wat wilde je zien of weten voor je boekte?'),o:[L3('Results on nails like mine','Des résultats sur des ongles comme les miens','Resultaten op nagels zoals de mijne'),L3('Reviews from other women','Des avis d’autres femmes','Reviews van andere vrouwen'),L3('The price up front','Le prix à l’avance','De prijs op voorhand'),L3('How long it lasts','Combien de temps ça tient','Hoe lang het blijft'),L3('What the first visit is like','Comment se passe la première visite','Hoe de eerste afspraak verloopt'),L3('The difference between BIAB and Russian manicure','La différence entre BIAB et manucure russe','Het verschil tussen BIAB en Russische manicure')],
    why:{l:L3('Why was that important to you?','Pourquoi était-ce important pour vous ?','Waarom was dat belangrijk voor jou?')}}
  ]},
 {img:'w5',h:L3('Your nails now','Vos ongles aujourd’hui','Je nagels nu'),
  p:L3('Last few. Then I’ll leave you in peace.','Les dernières. Ensuite je vous laisse tranquille.','De laatste. Daarna laat ik je met rust.'),
  qs:[
   {k:'Houdt nu',t:'one',q:L3('How long do your nails last now, between appointments?','Combien de temps vos ongles tiennent-ils maintenant ?','Hoe lang blijven je nagels nu mooi tussen twee afspraken?'),o:[L3('3 to 4 weeks or longer','3 à 4 semaines ou plus','3 à 4 weken of langer'),L3('2 to 3 weeks','2 à 3 semaines','2 à 3 weken'),L3('Less than 2 weeks','Moins de 2 semaines','Minder dan 2 weken')]},
   {k:'Gevoel nu',t:'multi',q:L3('How do you feel with your nails now?','Comment vous sentez-vous avec vos ongles maintenant ?','Hoe voel je je nu met je nagels?'),o:[L3('Polished and put together','Soignée','Verzorgd'),L3('More confident','Plus confiante','Zelfverzekerder'),L3('No more stress about my nails','Plus de stress pour mes ongles','Geen stress meer over mijn nagels'),L3('Like myself, but better','Comme moi, en mieux','Mezelf, maar beter')],
    why:{l:L3('Why does that matter to you?','Pourquoi est-ce important pour vous ?','Waarom is dat belangrijk voor jou?')}},
   {k:'Complimenten',t:'one',q:L3('Has anyone asked you about your nails?','Quelqu’un vous a-t-il déjà demandé pour vos ongles ?','Heeft iemand je al gevraagd naar je nagels?'),o:[L3('Several people','Plusieurs personnes','Meerdere mensen'),L3('One or two','Une ou deux','Een of twee'),L3('Not really','Pas vraiment','Niet echt')],
    why:{except:['Not really'],l:L3('What did they say?','Qu’ont-ils dit ?','Wat zeiden ze?')}},
   {k:'Review',t:'text',q:L3('How would you describe Bahami to a friend, in one line?','Comment décririez-vous Bahami à une amie, en une phrase ?','Hoe zou je Bahami in één zin aan een vriendin beschrijven?')},
   {k:'Foto',t:'photos',q:L3('A photo of your nails?','Une photo de vos ongles ?','Een foto van je nagels?'),h:L3('Only your hands. A before photo of your old nails is a big help.','Seulement vos mains. Une photo avant de vos anciens ongles aide énormément.','Alleen je handen. Een voor-foto van je oude nagels helpt enorm.')},
   {k:'Beter maken',t:'text',q:L3('Is there one thing I could do even better?','Y a-t-il une chose que je pourrais faire encore mieux ?','Is er één ding dat ik nog beter kan doen?'),h:L3('Only Mireille reads this.','Seule Mireille lit ceci.','Alleen Mireille leest dit.')},

   {k:'Contact',t:'contact',q:L3('Your Instagram or email','Votre Instagram ou e-mail','Je Instagram of e-mail'),h:L3('Optional. Only so Mireille can thank you or tag you.','Facultatif. Seulement pour que Mireille puisse vous remercier ou vous identifier.','Optioneel. Alleen zodat Mireille je kan bedanken of taggen.')}

let L=(()=>{try{const s=localStorage.getItem('bh-l');if(UI[s])return s}catch(e){} const n=(navigator.language||'en').slice(0,2);return UI[n]?n:'en'})();
const $=id=>document.getElementById(id), st={}, photos={}; let cur=0;
const ALLQ=CH.flatMap(c=>c.qs);
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function save(){document.querySelectorAll('#steps input,#steps textarea').forEach(i=>{if(i.type==='file')return; if(i.type==='checkbox'||i.type==='radio'){if(!st[i.name])st[i.name]=new Set(); i.checked?st[i.name].add(i.value):st[i.name].delete(i.value);} else st[i.name]=i.value;});}
function gal(){return '<div class="gal">'+GAL.map(([f,h,v])=>`<a href="${IG}${h}/" target="_blank" rel="noopener"${v?' class="v"':''}><img src="img/${f}.jpg" alt="Nails by Bahami" loading="lazy"></a>`).join('')+'</div>';}
function build(){
  save(); const u=UI[L]; let h='';
  CH.forEach(c=>{
    h+=`<section class="step"><img class="pic" src="img/${c.img}.jpg" alt=""><h1>${c.h[L]}</h1><p class="intro">${c.p[L]}</p><hr>`;
    c.qs.forEach(q=>{
      h+=`<div class="q"><h2>${q.q[L]}</h2>${q.h?`<p class="h">${q.h[L]}</p>`:''}`;
      if(q.t==='name') h+=`<input type="text" name="${q.k}" autocomplete="given-name">`;
      else if(q.t==='text') h+=`<textarea name="${q.k}"></textarea>`;
      else if(q.t==='contact') h+=`<div class="two"><input type="text" name="Instagram" placeholder="@" autocomplete="off"><input type="email" name="Email" placeholder="email" autocomplete="email"></div>`;
      else if(q.t==='photos') h+=`<div class="ph">${u.ph.map((p,i)=>`<label data-ph="${['Foto voor','Foto nu'][i]}"><input type="file" accept="image/*"><small>${p}</small><img alt="">${u.phPick}</label>`).join('')}</div>`;
      else { const ty=q.t==='one'?'radio':'checkbox'; h+=`<div class="chips" data-k="${q.k}">`+q.o.map(o=>`<label class="chip"><input type="${ty}" name="${q.k}" value="${esc(o.en)}"><span>${o[L]}</span></label>`).join('')+'</div>';
        if(q.why) h+=`<div class="why" data-for="${q.k}"><label>${q.why.l[L]}</label><textarea name="${q.k} - waarom"></textarea></div>`; }
      h+='</div>';
    });
    h+='</section>';
  });
  $('steps').innerHTML=h;
  document.querySelectorAll('#steps input,#steps textarea').forEach(i=>{ if(i.type==='file')return; if(i.type==='checkbox'||i.type==='radio'){ if(st[i.name]&&st[i.name].has(i.value)) i.checked=true; } else if(st[i.name]) i.value=st[i.name]; });
  ALLQ.filter(q=>q.why).forEach(q=>{ const box=document.querySelector(`.why[data-for="${q.k}"]`), g=document.querySelector(`.chips[data-k="${q.k}"]`);
    const sync=()=>{ const vals=[...g.querySelectorAll('input:checked')].map(i=>i.value).filter(v=>!(q.why.except||[]).includes(v)); box.classList.toggle('on',vals.length>0); };
    g.addEventListener('change',sync); sync(); });
  document.querySelectorAll('.ph label').forEach(l=>{ const k=l.dataset.ph; if(photos[k]){l.querySelector('img').src=URL.createObjectURL(photos[k]);l.classList.add('has');}
    l.querySelector('input').addEventListener('change',e=>{ const f=e.target.files[0]; if(!f)return; const img=new Image(), url=URL.createObjectURL(f);
      img.onload=()=>{ const r=Math.min(1,1400/Math.max(img.width,img.height)), c=document.createElement('canvas'); c.width=Math.round(img.width*r); c.height=Math.round(img.height*r); c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        c.toBlob(b=>{ photos[k]=b; l.querySelector('img').src=URL.createObjectURL(b); l.classList.add('has'); },'image/jpeg',0.8); URL.revokeObjectURL(url); }; img.src=url; }); });
  $('tSub').textContent=u.sub; $('tTime').textContent=u.time; $('back').textContent=u.back;
  document.querySelectorAll('#lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===L)); document.documentElement.lang=L;
  show(cur);
}
function show(i){ const u=UI[L], s=[...document.querySelectorAll('#steps .step')]; cur=i; s.forEach((x,k)=>x.classList.toggle('on',k===i));
  const pct=(i+1)/s.length*100; $('pl').style.width=pct+'%'; $('pd').style.left=pct+'%'; $('tOf').textContent=u.of[i];
  $('back').style.display=i?'':'none'; $('next').textContent=i===s.length-1?u.send:u.cont; $('err').textContent=''; }
function answers(){ save(); const out=[]; ALLQ.forEach(q=>{ if(['photos','contact'].includes(q.t))return;
  if(q.t==='name'||q.t==='text'){ const v=(st[q.k]||'').trim(); if(v) out.push([q.k,v]); }
  else { const v=st[q.k]?[...st[q.k]]:[]; if(v.length) out.push([q.k,v.join(', ')]); const w=(st[q.k+' - waarom']||'').trim(); if(w) out.push([q.k+' - waarom',w]); } });
  ['Instagram','Email'].forEach(k=>{const v=(st[k]||'').trim(); if(v) out.push([k,v]);}); return out; }
function myWords(){ save(); const lines=[], name=(st['Naam']||'').trim(); if(name) lines.push(name);
  const pick=k=>{const q=ALLQ.find(x=>x.k===k); const v=st[k]?[...st[k]]:[]; return v.map(en=>{const o=q.o.find(o=>o.en===en);return o?o[L]:en}).join(', ');};
  const add=k=>{ const q=ALLQ.find(x=>x.k===k), v=pick(k), w=(st[k+' - waarom']||'').trim(); if(v||w) lines.push(q.q[L]+'\n'+[v,w].filter(Boolean).join('. ')); };
  ['Probleem ervoor','Waarom Bahami','Houdt nu','Gevoel nu'].forEach(add);
  const r=(st['Review']||'').trim(); if(r) lines.push('“'+r+'”');
  return lines.join('\n\n'); }
function thanks(){ const u=UI[L], name=(st['Naam']||'').trim(), pts='<ol>'+u.pts.map(p=>'<li>'+p+'</li>').join('')+'</ol>';
  $('thanks').innerHTML=`<img class="pic" src="img/w6.jpg" alt=""><h1>${u.tyH}${name?', '+esc(name):''}</h1><p class="intro">${u.tyP}</p><p class="sig">Mireille</p><hr>
   <div class="q"><h2>${u.last}</h2><p class="h">${u.lastP}</p>
   <button type="button" class="pick top" data-p="v"><em class="best">${u.best}</em><b>🎥 ${u.v}</b><span>${u.vS}</span></button>
   <div class="how" id="h-v">${u.say}${pts}${u.vEnd}</div>
   <button type="button" class="pick" data-p="vo"><b>🎙️ ${u.vo}</b><span>${u.voS}</span></button>
   <div class="how" id="h-vo">${u.say}${pts}${u.vEnd}</div>
   <button type="button" class="pick" data-p="tx"><b>✍️ ${u.tx}</b><span>${u.txS}</span></button>
   <div class="how" id="h-tx"><pre class="rv" id="rv"></pre><button type="button" class="copy" id="cp">${u.copy}</button><p class="h" style="margin-top:10px">${u.txEnd}</p></div></div>
   <hr>${gal()}<div class="cap"><span>${u.work}</span><a href="${IG}" target="_blank" rel="noopener">@bahami.be →</a></div>
   <a class="cta" href="${PLANITY}" target="_blank" rel="noopener">${u.book}</a><a class="cta o" href="${IG}" target="_blank" rel="noopener">${u.follow}</a>`;
  $('rv').textContent=myWords();
  document.querySelectorAll('.pick').forEach(b=>b.onclick=()=>{ const id='h-'+b.dataset.p, open=!$(id).classList.contains('on');
    document.querySelectorAll('.how').forEach(x=>x.classList.remove('on')); document.querySelectorAll('.pick').forEach(x=>x.classList.remove('on'));
    if(open){$(id).classList.add('on'); b.classList.add('on');} });
  $('cp').onclick=async()=>{ try{await navigator.clipboard.writeText($('rv').textContent);}catch(e){ const r=document.createRange(); r.selectNodeContents($('rv')); const s=getSelection(); s.removeAllRanges(); s.addRange(r); document.execCommand('copy'); } $('cp').textContent=u.copied; };
}
$('back').onclick=()=>{ show(Math.max(0,cur-1)); scrollTo({top:0,behavior:'smooth'}); };
$('next').onclick=async()=>{ const u=UI[L], n=document.querySelectorAll('#steps .step').length; save();
  if(cur===0 && !(st['Naam']||'').trim()){ $('err').textContent=u.needName; document.querySelector('[name="Naam"]').focus(); return; }
  if(cur<n-1){ show(cur+1); scrollTo({top:0,behavior:'smooth'}); return; }
  const b=$('next'); b.disabled=true; b.textContent=u.sending;
  const nm=(st['Naam']||'').trim(), fd=new FormData(); fd.append('access_key',WEB3FORMS_KEY); fd.append('subject','Nieuwe review - Bahami'+(nm?' - '+nm:'')); fd.append('from_name','Bahami reviews');
  fd.append('botcheck',document.querySelector('[name=botcheck]').checked?'1':''); fd.append('Taal',L.toUpperCase());
  answers().forEach(([k,v])=>fd.append(k,v)); for(const k in photos) fd.append(k,photos[k],k.replace(' ','-').toLowerCase()+'.jpg');
  try{ const r=await fetch('https://api.web3forms.com/submit',{method:'POST',body:fd,headers:{Accept:'application/json'}}); const j=await r.json(); if(!j.success) throw 0;
    $('f').style.display='none'; $('top').style.display='none'; thanks(); $('thanks').classList.add('on'); scrollTo(0,0);
  }catch(e){ b.disabled=false; b.textContent=u.send; $('err').textContent=u.fail; } };
document.querySelectorAll('#lang button').forEach(b=>b.onclick=()=>{ L=b.dataset.l; try{localStorage.setItem('bh-l',L)}catch(e){} build(); if($('thanks').classList.contains('on')) thanks(); });
build();
</script>
